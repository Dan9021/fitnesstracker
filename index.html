<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1456ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--shell:#f4f4f7;--panel:#fff;--card:#f4f5f8;--hi:#e3e8fb;--act:#e7e8ee;--ink:#14171d;--muted:#737a89;--line:#e6e8ee;--accent:#2457ff;--accent-ink:#fff;--soft:#dfe6ff;--danger:#d64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--shell:#1a1d24;--panel:#12151b;--card:#1b1f27;--hi:#1e2a55;--act:#262b35;--ink:#eef1f5;--muted:#8d96a5;--line:#272d36;--accent:#6b8fff;--accent-ink:#0e1115;--soft:#243060;--danger:#ff7b7b}}
:root[data-theme="dark"]{color-scheme:dark;--shell:#1a1d24;--panel:#12151b;--card:#1b1f27;--hi:#1e2a55;--act:#262b35;--ink:#eef1f5;--muted:#8d96a5;--line:#272d36;--accent:#6b8fff;--accent-ink:#0e1115;--soft:#243060;--danger:#ff7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(115deg,#0b1aa0 0%,#1456ff 42%,#5aa9ff 68%,#9a7fe6 100%) fixed;color:var(--ink);font:500 15px/1.5 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:250px 1fr;margin:10px;min-height:calc(100vh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--shell);border-radius:32px;padding:24px 24px 24px 0}
.side{padding:8px 22px;display:flex;flex-direction:column;gap:6px}
.logo{height:56px;margin:0 0 30px 14px;color:var(--ink)}
.logo svg{width:48px;height:24px;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round}
.nav{display:flex;align-items:center;gap:14px;border:0;background:transparent;color:var(--ink);font:600 16px "Manrope",system-ui,sans-serif;padding:15px 14px;border-radius:18px;cursor:pointer;text-align:left;width:100%}
.nav[aria-current="page"]{background:var(--act)}
.main{background:var(--panel);border-radius:28px;padding:34px 36px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px}
h1{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:0}
.pill{display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:999px;background:var(--panel);box-shadow:0 8px 24px rgba(20,30,80,.08)}
.pill button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.pill .add{background:var(--accent);color:var(--accent-ink)}
.sub{color:var(--muted);font-size:18px;margin:0 0 22px;text-transform:capitalize}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.c{background:var(--card);border-radius:24px;padding:24px;margin-bottom:16px}
.cards .c{margin:0}
.c.hi{background:var(--hi)}
.lb{display:block;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.c p{margin:6px 0 0;color:var(--muted);font-size:16px}
.big{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.num{display:block;font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.num small{font-size:18px;font-weight:600;color:var(--muted);letter-spacing:0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}
h2{font-size:18px;font-weight:700;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.f{grid-column:span 2}.f.w{grid-column:span 6}.f.h{grid-column:span 3}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
input{width:100%;font:600 15px "Manrope",system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:46px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 15px "Manrope",system-ui,sans-serif;padding:12px;min-height:46px;cursor:pointer;margin-top:14px}
.day{font-size:13px;font-weight:700;color:var(--muted);margin:20px 0 8px;text-transform:capitalize}
.list{padding-top:6px;padding-bottom:6px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:700}.row .t span{color:var(--muted);font-size:14px}
.row .v{font-weight:800;font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;width:36px;height:36px;border-radius:10px;cursor:pointer}
.x:hover{color:var(--danger);background:var(--panel)}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.up{color:var(--danger)}.down{color:var(--accent)}
svg.ch{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}.gt{fill:var(--muted);font:600 11px "Manrope",system-ui,sans-serif}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--soft)}.dt{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.goal{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.goalrow{display:flex;align-items:center;gap:10px;margin-top:14px}
.goalrow label{margin:0;white-space:nowrap}.goalrow input{max-width:130px}
@media (max-width:860px){
 .shell{grid-template-columns:1fr;padding:10px;margin:6px;border-radius:26px;min-height:calc(100vh - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
 .side{position:fixed;z-index:5;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));flex-direction:row;padding:6px;gap:4px;background:var(--shell);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(10,20,80,.25)}
 .logo{display:none}
 .nav{flex-direction:column;gap:2px;font-size:12px;padding:8px 4px;border-radius:16px;align-items:center;text-align:center}
 .main{padding:22px 18px 110px;border-radius:22px}
 h1{font-size:32px}.cards{grid-template-columns:1fr}.num{font-size:40px}
 .f{grid-column:span 3}.f.q{grid-column:span 2}
}
/* compacto + movimiento */
body{font-size:13.5px;background-size:180% 180%;animation:flow 16s ease-in-out infinite alternate}
svg.i{width:18px;height:18px}
.shell{grid-template-columns:190px 1fr;margin:8px;padding:16px 16px 16px 0;border-radius:26px;min-height:calc(100vh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.side{padding:4px 14px;gap:4px}
.logo{height:40px;margin:0 0 14px 12px}.logo svg{width:36px;height:18px;stroke-width:4.5;animation:wiggle 1.2s .4s ease}
.nav{font-size:14px;padding:10px 12px;gap:10px;border-radius:13px;transition:background .2s,transform .2s;animation:rise .5s backwards}
.nav:nth-of-type(1){animation-delay:.08s}.nav:nth-of-type(2){animation-delay:.14s}.nav:nth-of-type(3){animation-delay:.2s}
.nav:hover{background:var(--act);transform:translateX(3px)}
.nav svg{transition:transform .25s}.nav:hover svg{transform:scale(1.15) rotate(-6deg)}
.main{padding:20px 22px 26px;border-radius:20px}
h1{font-size:26px}h1.pop{animation:pop .4s cubic-bezier(.2,.7,.2,1)}
.top{margin-bottom:14px}
.pill{padding:4px;gap:4px}.pill button{width:34px;height:34px;transition:transform .2s,background .2s}
.pill .add:hover{background:var(--accent);transform:scale(1.08)}.pill svg{transition:transform .3s}.pill .add:hover svg{transform:rotate(90deg)}
.sub{font-size:13.5px;margin-bottom:12px}
.cards{gap:10px;margin-bottom:10px}
.c{padding:14px 16px;border-radius:16px;margin-bottom:10px;transition:transform .25s,box-shadow .25s}
.cards .c:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,30,80,.12)}
.lb{font-size:10.5px;margin-bottom:6px}
.c p{font-size:12.5px;margin-top:4px}
.big{font-size:19px}.num{font-size:30px}.num small{font-size:12.5px}
h2{font-size:14.5px;margin-bottom:10px}
.grid{gap:10px}label{font-size:12px}
input{font-size:13.5px;min-height:38px;padding:7px 11px;border-radius:11px;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.btn{min-height:38px;font-size:13.5px;border-radius:11px;margin-top:10px;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.day{margin:14px 0 6px;font-size:12px}
.row{padding:8px 0;transition:opacity .2s,transform .2s}
.x{width:30px;height:30px;font-size:18px;transition:color .2s,background .2s,transform .2s}.x:hover{transform:rotate(90deg)}
.empty{padding:16px 8px}.goalrow{margin-top:10px}
.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards}
.enter>:nth-child(2){animation-delay:.07s}.enter>:nth-child(3){animation-delay:.14s}.enter>:nth-child(4){animation-delay:.21s}.enter>:nth-child(5){animation-delay:.28s}
.enter .cards{animation:none}
.enter .cards>.c{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards}
.enter .cards>.c:nth-child(2){animation-delay:.08s}.enter .cards>.c:nth-child(3){animation-delay:.16s}
.enter .ln{stroke-dasharray:1 2;stroke-dashoffset:1;animation:draw 1.2s .3s cubic-bezier(.4,0,.2,1) forwards}
.enter .ar,.enter .dt{animation:fade .6s 1s backwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
.ar{fill:url(#ag)}.s1{stop-color:var(--accent);stop-opacity:.32}.s2{stop-color:var(--accent);stop-opacity:0}
.ln{stroke-width:3}.gl{stroke-dasharray:3 5}
svg.ch{touch-action:pan-y;cursor:crosshair}
#hv{opacity:0;pointer-events:none;transition:opacity .15s}
.hl{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 4;opacity:.6;transition:transform .12s ease-out}
.hd{fill:var(--panel);stroke:var(--accent);stroke-width:3;transition:transform .12s ease-out}
#tp{transition:transform .12s ease-out}
.tb{fill:var(--ink)}.t1{fill:var(--panel);font:800 14px "Manrope",system-ui,sans-serif}.t2{fill:var(--panel);opacity:.7;font:600 10.5px "Manrope",system-ui,sans-serif}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flow{to{background-position:100% 50%}}
@keyframes wiggle{30%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
@media (max-width:860px){
 .shell{grid-template-columns:1fr;padding:8px;margin:5px;border-radius:22px}
 .nav{flex-direction:column;font-size:11.5px;padding:7px 4px;gap:2px}.nav:hover{transform:none}
 .main{padding:18px 14px 96px;border-radius:18px}
 h1{font-size:22px}.cards{grid-template-columns:1fr}.num{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.enter .ln{stroke-dasharray:none;stroke-dashoffset:0}}
[hidden]{display:none!important}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;min-height:40px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);font:700 13.5px "Manrope",system-ui,sans-serif;cursor:pointer;transition:transform .15s,border-color .2s}
.gbtn:hover{border-color:var(--accent)}.gbtn:active{transform:scale(.97)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.acard{width:100%;max-width:360px;background:var(--shell);border-radius:24px;padding:26px 24px;box-shadow:0 20px 50px rgba(10,20,80,.3);animation:rise .5s backwards}
.acard h1{font-size:24px;margin:0 0 4px}.acard .s{color:var(--muted);margin:0 0 18px}
.acard input{margin-bottom:12px}
.amsg{min-height:18px;font-size:12.5px;color:var(--danger);margin-top:10px}
.alink{background:none;border:0;color:var(--accent);font:600 13px "Manrope",system-ui,sans-serif;cursor:pointer;margin-top:10px;width:100%;padding:6px}
/* ===== extras: paletas, login, anillo, records ===== */
:root[data-pal="verde"]{--accent:#12a676;--g1:#032f25;--g2:#0a8f67;--g3:#43c99b;--g4:#a8e6cf}
:root[data-pal="naranja"]{--accent:#f0701f;--g1:#6f1a04;--g2:#e5551a;--g3:#ff9f52;--g4:#ffd28a}
:root[data-pal="violeta"]{--accent:#8b5cf6;--g1:#25095e;--g2:#6d3bf0;--g3:#b07cff;--g4:#f0a6dd}
:root[data-pal]{--hi:color-mix(in srgb,var(--accent) 14%,var(--panel));--soft:color-mix(in srgb,var(--accent) 24%,var(--panel))}
body{background:linear-gradient(115deg,var(--g1,#0b1aa0) 0%,var(--g2,#1456ff) 42%,var(--g3,#5aa9ff) 68%,var(--g4,#9a7fe6) 100%) fixed;background-size:180% 180%}
.dot{display:block;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#e8a0f0);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;animation:pop .5s backwards}
.av img{width:100%;height:100%;object-fit:cover}
.auth{position:relative;overflow:hidden}
.auth::before,.auth::after{content:"";position:absolute;width:42vmax;height:42vmax;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 14s ease-in-out infinite alternate}
.auth::before{background:var(--g4,#9a7fe6);top:-12vmax;right:-8vmax}
.auth::after{background:var(--g3,#5aa9ff);bottom:-14vmax;left:-10vmax;animation-delay:-6s}
@keyframes float{to{transform:translate(6vmax,5vmax) scale(1.15)}}
.acard{position:relative;z-index:1;max-width:380px;padding:30px 26px;background:color-mix(in srgb,var(--shell) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.4)}
.alogo{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:16px;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 45%,transparent);animation:wiggle 1.4s .5s ease}
.alogo svg{width:30px;height:15px;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round}
.rk{display:flex;align-items:center;gap:18px}
.rk svg{flex:none}
.rg{fill:none;stroke:var(--line);stroke-width:8}
.rp{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:213.6;stroke-dashoffset:var(--o);transform:rotate(-90deg);transform-origin:42px 42px;animation:ringin 1.1s .3s cubic-bezier(.3,.7,.2,1) backwards}
@keyframes ringin{from{stroke-dashoffset:213.6}}
.rt{fill:var(--ink);font:800 16px "Manrope",system-ui,sans-serif}
.pr{font-style:normal;font-size:10px;font-weight:800;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:99px;margin-left:8px;vertical-align:2px}
select{max-width:60%;font:600 13px "Manrope",system-ui,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 10px;min-height:34px}
svg.sp{display:block;width:100%;height:auto}
/* ===== ajustes ===== */
.prof{display:flex;align-items:center;gap:14px;margin-bottom:14px}.prof p{margin:2px 0 0}
.av.big{width:52px;height:52px;font-size:20px}#av{cursor:pointer}
.amsg.ok{color:var(--accent)}
.sw{display:flex;gap:12px;margin-top:8px}
.swb{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);cursor:pointer;transition:transform .2s,box-shadow .2s}
.swb:hover{transform:scale(1.1)}.swb.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--panel);color:var(--danger);border:1px solid var(--line)}
.phb{display:flex;gap:10px;margin-bottom:6px}.phb .btn{margin-top:0;flex:1}
/* ===== feeling insecure ===== */
.feel{margin-top:auto;animation-delay:.26s}
.feel svg.i{fill:#2f6bff;stroke:none;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.12)}70%{transform:scale(1)}}
.note{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(10,15,40,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s}
.ncard{width:100%;max-width:380px;background:var(--panel);border-radius:24px;padding:28px 24px 22px;text-align:center;box-shadow:0 24px 60px rgba(10,20,80,.35);animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.nheart{width:46px;height:46px;fill:#2f6bff;margin-bottom:10px;animation:beat 1.6s ease-in-out infinite}
.nmsg{font-size:19px;font-weight:700;line-height:1.4;margin:6px 0 12px;letter-spacing:-.01em}
.nsub{color:var(--muted);font-size:12.5px;margin:0 0 4px}
.nbt{display:flex;gap:10px}.nbt .btn{flex:1;margin-top:16px}
@media (max-width:860px){.feel{margin-top:0}.feel span{display:none}}
/* ===== PIN ===== */
.lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:linear-gradient(115deg,var(--g1,#0b1aa0) 0%,var(--g2,#1456ff) 42%,var(--g3,#5aa9ff) 68%,var(--g4,#9a7fe6) 100%);animation:fade .25s}
.pcard{width:100%;max-width:320px;text-align:center;background:color-mix(in srgb,var(--shell) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;padding:26px 22px 16px;box-shadow:0 24px 60px rgba(10,20,80,.35)}
.pcard .alogo{margin:0 auto 14px}.pcard h1{font-size:20px;margin:0 0 14px}
.pdots{display:flex;justify-content:center;gap:14px;margin-bottom:6px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:background .15s,transform .15s,border-color .15s}
.pdots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 6px}
.pad button{height:56px;border-radius:16px;border:0;background:var(--panel);color:var(--ink);font:700 20px "Manrope",system-ui,sans-serif;cursor:pointer;transition:transform .12s,background .15s}
.pad button:hover{background:var(--card)}.pad button:active{transform:scale(.92)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* ===== rutinas, descanso, actividad, logros ===== */
.rest{position:fixed;right:22px;bottom:22px;z-index:90;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:99px;background:var(--ink);color:var(--panel);box-shadow:0 12px 30px rgba(10,20,80,.3);animation:rise .35s backwards}
.rest .lb{color:inherit;opacity:.7;margin:0}.rest b{font-size:20px;font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.rest button{border:0;border-radius:99px;background:color-mix(in srgb,var(--panel) 18%,transparent);color:inherit;font:700 13px "Manrope",system-ui,sans-serif;padding:6px 12px;cursor:pointer}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:4px}
.hc{aspect-ratio:1;border-radius:4px;background:var(--line);transition:transform .15s}.hc:hover{transform:scale(1.25)}

<script>
const KEY="fit-tracker-v1";

try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
/* ===== Supabase ===== */
const SUPABASE_URL="https://asutlwblgwhmfwrsdepb.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzdXRsd2JsZ3dobWZ3cnNkZXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAxNTAyNzgsImV4cCI6MjA3NTcyNjI3OH0.g0av0iE1Ki-PczknxCOP0UHUK_fn2tRawKiLeZD2Oew";

const save=()=>{
  if(!user||!sb)return;

};
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN=n=>(Math.round(n*10)/10).toLocaleString("es-ES");
const dt=d=>new Date(d+"T12:00");
const fmtD=d=>dt(d).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
const fmtS=d=>dt(d).toLocaleDateString("es-ES",{day:"numeric",month:"short"});
const vol=a=>a.reduce((s,w)=>s+w.sets*w.reps*w.kg,0);
const sw=()=>[...S.weights].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

const PALS=["azul","verde","naranja","violeta"];
function setPal(q){const r=document.documentElement;if(q==="azul")delete r.dataset.pal;else r.dataset.pal=q;try{localStorage.setItem("fit-pal",q)}catch(e){}$("#pal").title="Color: "+q}
const nm=()=>{if(!user)return"";const md=user.user_metadata||{};return md.full_name||(user.email||"").split("@")[0]};
function streak(){
  const ds=new Set(S.workouts.map(w=>w.date)),f=x=>new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  let n=0,d=new Date();if(!ds.has(f(d)))d.setDate(d.getDate()-1);
  while(ds.has(f(d))){n++;d.setDate(d.getDate()-1)}return n;
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99";
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext("2d"),cols=["#2457ff","#12a676","#f0701f","#8b5cf6","#ffd23f","#ff5c8a"];
  const ps=Array.from({length:90},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:4+Math.random()*5,r:Math.random()*6,c:cols[Math.random()*6|0]}));
  let f=0;(function t(){x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<110)requestAnimationFrame(t);else c.remove()})();
}
let pe="";
function prog(names,mx){
  if(!names.length)return"";
  if(!names.includes(pe))pe=names[0];
  const by={};S.workouts.filter(w=>w.ex===pe).forEach(w=>{by[w.date]=Math.max(by[w.date]||0,w.kg)});
  const ds=Object.keys(by).sort(),vs=ds.map(d=>by[d]);
  let svg=`<div class="empty">Registra este ejercicio en otro día para ver tu progreso.</div>`;
  if(ds.length>1){
    const W=600,H=150,mn=Math.min(...vs),r=(Math.max(...vs)-mn)||1;
    const P=vs.map((v,i)=>[+(10+i*(W-20)/(ds.length-1)).toFixed(1),+(H-16-(v-mn)/r*(H-36)).toFixed(1)]),l=curve(P),e=P[P.length-1];
    svg=`<svg class="sp" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs><path class="ar" d="${l} L${e[0]},${H} L${P[0][0]},${H}Z"/><path class="ln" d="${l}"/><circle class="dt" cx="${e[0]}" cy="${e[1]}" r="4.5"/></svg>`;
  }
  return `<div class="c"><div class="hd"><h2 style="margin:0">Progreso</h2><select id="pe" aria-label="Ejercicio">${names.map(n=>`<option${n===pe?" selected":""}>${esc(n)}</option>`).join("")}</select></div><p style="margin:0 0 8px">Récord: <b>${fmtN(mx[pe])} kg</b></p>${svg}</div>`;
}
const avHtml=()=>{const md=user.user_metadata||{};const ph=md.photo||md.avatar_url;return ph?`<img src="${esc(ph)}" alt="" referrerpolicy="no-referrer">`:esc((nm()[0]||"?").toUpperCase())};
const curPal=()=>{try{return localStorage.getItem("fit-pal")||"azul"}catch(e){return"azul"}};
function toJpeg(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=320;
      c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,320,320);URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error("No se pudo procesar la imagen")),"image/jpeg",.85)};
    img.onerror=()=>rej(new Error("Esa imagen no es válida."));img.src=u;
  });
}
function ajustes(){
  const cols={azul:"#2457ff",verde:"#12a676",naranja:"#f0701f",violeta:"#8b5cf6"},cp=curPal();
  return `<div class="c"><h2>Perfil</h2>
    <div class="prof"><div class="av big">${avHtml()}</div><div><b>${esc(nm())}</b><p>${esc(user.email||"")}</p></div></div>
    <div class="phb"><button class="btn ghost" id="phb" type="button">Cambiar foto</button>${(user.user_metadata||{}).photo?'<button class="btn ghost" id="phr" type="button">Quitar foto</button>':""}</div>
    <input id="phf" type="file" accept="image/*" hidden><div class="amsg" id="phmsg" role="status"></div>
    <form id="nf"><label for="nn">Nombre para mostrar</label><input id="nn" value="${esc(nm())}" maxlength="40" required>
    <button class="btn" type="submit">Guardar nombre</button><div class="amsg" id="nmsg" role="status"></div></form></div>
  <div class="c"><h2>Objetivo y apariencia</h2>
    <label for="wgi">Entrenos por semana</label><input id="wgi" type="number" min="1" max="14" inputmode="numeric" value="${S.wg||4}">
    <label for="rsi" style="margin-top:14px">Descanso entre series (segundos)</label><input id="rsi" type="number" min="15" max="600" step="15" inputmode="numeric" value="${S.rest||90}">
    <label style="margin-top:14px">Color de la app</label>
    <div class="sw">${PALS.map(n=>`<button class="swb${n===cp?" on":""}" data-p="${n}" style="--c:${cols[n]}" aria-label="${n}" title="${n}"></button>`).join("")}</div></div>
  <div class="c"><h2>Seguridad</h2>
    <form id="pf"><label for="np">Nueva contraseña</label><input id="np" type="password" minlength="6" autocomplete="new-password" required>
    <button class="btn" type="submit">Cambiar contraseña</button><div class="amsg" id="pmsg" role="status"></div></form></div>
  <div class="c"><h2>Bloqueo con PIN</h2>
    <p style="margin:0">${hasPin()?"Tu cuenta está protegida con un PIN. Se pedirá en todos tus dispositivos.":"Protege tu cuenta con un PIN de 4 dígitos. Se pedirá en todos tus dispositivos."}</p>
    ${hasPin()?`<div class="phb" style="margin-top:12px"><button class="btn ghost" id="pinchg" type="button">Cambiar PIN</button><button class="btn ghost" id="pinoff" type="button">Quitar PIN</button></div><button class="btn" id="pinlock" type="button">Bloquear ahora</button>`:`<button class="btn" id="pinon" type="button">Activar PIN</button>`}
    <div class="amsg" id="pinmsg" role="status"></div></div>
  <div class="c"><h2>Tus datos</h2>
    <button class="btn ghost" id="exd" type="button" style="margin-top:0">Exportar mis datos (JSON)</button>
    <button class="btn danger" id="rsd" type="button">Borrar todos mis entrenos y pesos</button>
    <button class="btn" id="out2" type="button">Cerrar sesión</button></div>
  <p class="nsub" style="text-align:center">Versión 18 oct · rutinas, descanso y logros</p>`;
}
function bindSettings(){
  const say=(id,t,bad)=>{const e=$(id);e.textContent=t;e.className="amsg"+(bad?"":" ok")};
  $("#nf").onsubmit=async e=>{e.preventDefault();
    const r=await sb.auth.updateUser({data:{full_name:$("#nn").value.trim()}});
    if(r.error)return say("#nmsg",r.error.message,1);
    user=r.data.user;$("#av").innerHTML=avHtml();render();say("#nmsg","Nombre actualizado.")};
  const bi=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  const pinRes=r=>{render();if(r===true)say("#pinmsg","Listo, PIN guardado.");else if(r==="mismatch")say("#pinmsg","Los dos PIN no coinciden. Inténtalo de nuevo.",1);else if(r==="error")say("#pinmsg","No se pudo guardar el PIN. Inténtalo de nuevo.",1)};
  bi("#pinon",async()=>pinRes(await setPinFlow()));
  bi("#pinchg",async()=>{const old=await verifyPin({cancel:true});if(!old)return;pinRes(await setPinFlow(old))});
  bi("#pinoff",async()=>{const old=await verifyPin({cancel:true});if(!old)return;const r=await sb.rpc("pin_remove",{p:old});closePin();if(!r.error&&r.data==="ok")pinOn=false;render();if(!r.error&&r.data==="ok")say("#pinmsg","PIN desactivado.");else say("#pinmsg","No se pudo quitar el PIN.",1)});
  bi("#pinlock",()=>lockNow());
  $("#phb").onclick=()=>$("#phf").click();
  $("#phf").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;say("#phmsg","Subiendo…");
    try{
      const b=await toJpeg(f),path=`${user.id}/avatar.jpg`,st=sb.storage.from("avatars");
      const up=await st.upload(path,b,{upsert:true,contentType:"image/jpeg"});if(up.error)throw up.error;
      const r=await sb.auth.updateUser({data:{photo:st.getPublicUrl(path).data.publicUrl+"?v="+Date.now()}});if(r.error)throw r.error;
      user=r.data.user;$("#av").innerHTML=avHtml();render();say("#phmsg","Foto actualizada.");
    }catch(err){say("#phmsg",err.message||"No se pudo subir la foto.",1)}
  };
  const phr=$("#phr");
  if(phr)phr.onclick=async()=>{
    await sb.storage.from("avatars").remove([`${user.id}/avatar.jpg`]);
    const r=await sb.auth.updateUser({data:{photo:""}});if(r.error)return say("#phmsg",r.error.message,1);
    user=r.data.user;$("#av").innerHTML=avHtml();render();say("#phmsg","Foto eliminada.");
  };
  $("#rsi").onchange=e=>{S.rest=Math.max(15,Math.min(600,parseInt(e.target.value)||90));e.target.value=S.rest;save()};
  $("#wgi").onchange=e=>{const n=Math.max(1,Math.min(14,parseInt(e.target.value)||4));S.wg=n;e.target.value=n;save()};
  document.querySelectorAll(".swb").forEach(b=>b.onclick=()=>{setPal(b.dataset.p);document.querySelectorAll(".swb").forEach(x=>x.classList.toggle("on",x===b))});
  $("#pf").onsubmit=async e=>{e.preventDefault();
    const r=await sb.auth.updateUser({password:$("#np").value});
    if(r.error)return say("#pmsg",em(r.error.message),1);
    $("#np").value="";say("#pmsg","Contraseña actualizada.")};
  $("#exd").onclick=()=>{const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
    a.download="fitness-datos.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
  $("#rsd").onclick=()=>{if(confirm("¿Borrar todos tus entrenos y pesos? No se puede deshacer.")){S=Object.assign(EMPTY(),{wg:S.wg});save();render()}};
  $("#out2").onclick=()=>$("#out").click();
}
/* ===== PIN de cuenta (se verifica en el servidor, vale en todos tus dispositivos) ===== */
let pinOn=false,pbuf="",pres=null,hiddenAt=0;
const hasPin=()=>!!(user&&pinOn);
const dots=()=>document.querySelectorAll(".pdots i").forEach((d,i)=>d.classList.toggle("on",i<pbuf.length));
function closePin(){$("#lock").hidden=true;$(".shell").inert=false;pres=null}
function askPin(title,o={}){
  return new Promise(r=>{
    pbuf="";pres=r;$("#ptitle").textContent=title;$("#pmsg2").textContent=o.msg||"";
    $("#pcancel").hidden=!o.cancel;$("#pforgot").hidden=!o.forgot;dots();
    $("#lock").hidden=false;$(".shell").inert=true;
  });
}
function pinKey(k){
  if(!pres)return;
  if(k==="b")pbuf=pbuf.slice(0,-1);else if(pbuf.length<4)pbuf+=k;
  dots();
  if(pbuf.length===4){const r=pres,v=pbuf;pres=null;setTimeout(()=>r(v),120)}
}
async function verifyPin(o){
  let msg="";
  for(;;){
    const p=await askPin("Introduce tu PIN",{cancel:o.cancel,forgot:o.forgot,msg});
    if(p===null)return "";
    const r=await sb.rpc("pin_check",{p}),v=r.error?"error":r.data;
    if(v==="ok"||v==="none"){if(v==="none")pinOn=false;return p}
    const c=$("#pcard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
    msg=v==="bad"?"PIN incorrecto.":String(v).startsWith("locked:")?"Demasiados intentos. Espera "+String(v).slice(7)+" s.":"No se pudo comprobar el PIN. Revisa tu conexión.";
  }
}
async function setPinFlow(old){

let CP=[];
function curve(P){
  const n=P.length,dx=[],m=[],t=[];
  for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];m[i]=(P[i+1][1]-P[i][1])/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];
  for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=t[i+1]=0}else{const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}}
  let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=` C${P[i][0]+h},${P[i][1]+t[i]*h} ${P[i+1][0]-h},${P[i+1][1]-t[i+1]*h} ${P[i+1][0]},${P[i+1][1]}`}
  return d;
}
function hover(){

  };
  sv.onpointermove=move;sv.onpointerdown=move;sv.onpointerleave=()=>{hv.style.opacity=0};
}
function chart(){
  const d=sw().slice(-30);
  if(d.length<2)return `<div class="empty">Registra al menos dos pesos para ver tu evolución.</div>`;
  const W=600,H=230,p={l:44,r:14,t:14,b:26};

  let mn=Math.min(...v),mx=Math.max(...v);const pad=Math.max((mx-mn)*.15,.5);mn-=pad;mx+=pad;
  const X=i=>p.l+i*(W-p.l-p.r)/(d.length-1),Y=y=>p.t+(mx-y)*(H-p.t-p.b)/(mx-mn);
  const P=d.map((x,i)=>[+X(i).toFixed(1),+Y(x.kg).toFixed(1)]),line=curve(P);
  CP=d.map((x,i)=>({x:P[i][0],y:P[i][1],kg:x.kg,date:fmtS(x.date)}));
  const area=`${line} L${P[P.length-1][0]},${H-p.b} L${P[0][0]},${H-p.b}Z`;
  const ticks=[0,1,2].map(k=>mn+(mx-mn)*k/2);
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">
    ${ticks.map(t=>`<line class="gl" x1="${p.l}" x2="${W-p.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="gt" x="${p.l-8}" y="${Y(t)+4}" text-anchor="end">${fmtN(t)}</text>`).join("")}
    ${S.goal?`<line class="goal" x1="${p.l}" x2="${W-p.r}" y1="${Y(S.goal)}" y2="${Y(S.goal)}"/>`:""}

    <path class="ar" d="${area}"/><path class="ln" pathLength="1" d="${line}"/>
    <circle class="dt" cx="${P[P.length-1][0]}" cy="${P[P.length-1][1]}" r="4.5"/>
    <text class="gt" x="${p.l}" y="${H-6}">${fmtS(d[0].date)}</text><text class="gt" x="${W-p.r}" y="${H-6}" text-anchor="end">${fmtS(d[d.length-1].date)}</text>
    <g id="hv"><line class="hl" x1="0" x2="0" y1="${p.t}" y2="${H-p.b}"/><circle class="hd" cx="0" cy="0" r="6"/>
    <g id="tp"><rect class="tb" rx="9" width="92" height="42"/><text class="t1" x="46" y="19" text-anchor="middle"></text><text class="t2" x="46" y="34" text-anchor="middle"></text></g></g>
    <rect class="hit" width="${W}" height="${H}" fill="transparent"/></svg>`;
}

function count(){

  document.querySelectorAll("#app .num").forEach(el=>{
    const tn=el.firstChild;if(!tn||tn.nodeType!==3)return;
    const m=tn.nodeValue.match(/^([+-]?)([\d.,]+)$/);if(!m)return;
    const to=parseFloat(m[2].replace(/\./g,"").replace(",",".")),dec=(m[2].split(",")[1]||"").length,t0=performance.now();
    const step=t=>{const p=Math.min((t-t0)/750,1),e=1-Math.pow(1-p,3);
      tn.nodeValue=m[1]+(to*e).toLocaleString("es-ES",{minimumFractionDigits:dec,maximumFractionDigits:dec});
      if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

async function enter(u){
  const r=await sb.from("fitness_data").select("data").eq("user_id",u.id).maybeSingle();
  if(r.error){$("#auth").hidden=false;$(".shell").hidden=true;msg("No se pudieron cargar tus datos: "+r.error.message);return}
  user=u;
  if(r.data&&r.data.data)S=Object.assign(EMPTY(),r.data.data);
  else{save();try{localStorage.removeItem(KEY)}catch(e){}}
  const ps=await sb.rpc("pin_status");
  if(ps.error){user=null;$("#auth").hidden=false;$(".shell").hidden=true;msg("No se pudo comprobar el PIN: "+ps.error.message);return}
  pinOn=ps.data===true;
  let wasReset=false;const rk="fit-pinreset:"+u.id;
  try{localStorage.removeItem("fit-pin:"+u.id);
    if(pinOn&&localStorage.getItem(rk)){const rr=await sb.rpc("pin_reset");if(rr.data==="ok"){pinOn=false;wasReset=true}localStorage.removeItem(rk)}}catch(e){}

$("#out").onclick=async()=>{
  closePin();await sb.auth.signOut();user=null;S=EMPTY();
  $(".shell").hidden=true;$("#auth").hidden=false;$("#ap").value="";setMode("in");
};
const NOTES=[
  "Estás aquí, y eso ya cuenta. Un entreno imperfecto sigue siendo un entreno.",
  "Compararte con otros solo te muestra un fragmento. Tu camino tiene su propio ritmo.",
  "Todas las personas del gimnasio empezaron sin saber qué hacían. Tú también puedes.",
  "Descansar no es retroceder. Tu cuerpo crece cuando le das tiempo.",
  "No necesitas hacerlo perfecto, solo seguir apareciendo.",
  "El número de la báscula es un dato, no un veredicto sobre ti.",
  "Hoy puede costar más que ayer y mañana menos que hoy. Todos los días suman.",
  "Eres más fuerte de lo que te sientes ahora mismo.",
  "Empezar algo nuevo es de valientes, y tú lo estás haciendo.",
  "Respira. Lo estás haciendo mejor de lo que crees."
];
let lastN=-1;
function pickNote(){
  let i;do{i=Math.random()*NOTES.length|0}while(i===lastN);lastN=i;
  const first=nm().split(" ")[0],n=S.workouts.length,m=$("#nmsg2");
  $("#nt").textContent=first?"Una nota para ti, "+first:"Una nota para ti";
  m.textContent=NOTES[i];m.style.animation="none";void m.offsetWidth;m.style.animation="rise .4s backwards";
  $("#nsub").textContent=n?"Llevas "+n+(n===1?" ejercicio registrado":" ejercicios registrados")+". Eso es constancia.":"Empezar ya es ganar.";
}
const closeNote=()=>{$("#note").hidden=true;$("#feel").focus()};
$("#feel").onclick=()=>{pickNote();$("#note").hidden=false;$("#nclose").focus()};
$("#nmore").onclick=pickNote;
$("#nclose").onclick=closeNote;
$("#note").onclick=e=>{if(e.target.id==="note")closeNote()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#note").hidden)closeNote()});
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
$("#rplus").onclick=()=>{rEnd+=15000;tickRest()};
$("#rskip").onclick=()=>{clearInterval(rT);$("#rest").hidden=true};
$("#app").addEventListener("click",e=>{
  const b=e.target.closest("[data-rt]");if(!b)return;
  const R=S.routines=S.routines||[],t=today(),a=b.dataset.rt;
  if(a==="save"){const n=(prompt("Nombre de la rutina:","")||"").trim();if(!n)return;
    R.push({id:uid(),name:n.slice(0,30),items:S.workouts.filter(w=>w.date===t).map(w=>({ex:w.ex,sets:w.sets,reps:w.reps,kg:w.kg}))})}
  else if(a==="del"){S.routines=R.filter(r=>r.id!==b.dataset.id)}
  else{const r=R.find(r=>r.id===b.dataset.id);if(!r)return;
    r.items.forEach(i=>{const l=[...S.workouts].reverse().find(w=>w.ex===i.ex);S.workouts.push({id:uid(),date:t,ex:i.ex,sets:i.sets,reps:i.reps,kg:l?l.kg:i.kg})});startRest()}
  save();render();
});
$("#av").onclick=()=>{tab="ajustes";render(true)};
$("#pal").onclick=()=>setPal(PALS[(PALS.indexOf(localStorage.getItem("fit-pal")||"azul")+1)%PALS.length]);
try{setPal(localStorage.getItem("fit-pal")||"azul")}catch(e){}
(async()=>{
  if(!sb){$("#auth").hidden=false;msg("Falta configurar SUPABASE_URL y SUPABASE_KEY en el código.");return}
  const {data}=await sb.auth.getSession();
  if(data.session)enter(data.session.user);else $("#auth").hidden=false;
})();
</script>
</body>
</html>
